name: Backend integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETFS_RUN_INTEGRATION: "true"
      NETFS_TEST_HOST: 127.0.0.1
      NETFS_TEST_USER: netfstest
      NETFS_TEST_PASSWORD: netfs-test-password
      NETFS_TEST_SMB_SHARE: netfs
      R_KEYRING_BACKEND: env
      NETFS_TEST_IDENTITY_FILE: ${{ runner.temp }}/netfs_ci_ed25519

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Provision disposable backend services
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server vsftpd samba smbclient

          sudo useradd --create-home --shell /bin/bash "$NETFS_TEST_USER"
          echo "$NETFS_TEST_USER:$NETFS_TEST_PASSWORD" | sudo chpasswd

          ssh-keygen -q -t ed25519 -N "" -f "$NETFS_TEST_IDENTITY_FILE"
          sudo install -d -m 700 -o "$NETFS_TEST_USER" -g "$NETFS_TEST_USER" "/home/$NETFS_TEST_USER/.ssh"
          sudo install -m 600 -o "$NETFS_TEST_USER" -g "$NETFS_TEST_USER" "$NETFS_TEST_IDENTITY_FILE.pub" "/home/$NETFS_TEST_USER/.ssh/authorized_keys"
          sudo install -d -m 755 /run/sshd
          sudo service ssh restart
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H "$NETFS_TEST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          sudo tee /etc/vsftpd.conf >/dev/null <<'EOF'
          listen=YES
          listen_ipv6=NO
          anonymous_enable=NO
          local_enable=YES
          write_enable=YES
          local_umask=022
          chroot_local_user=YES
          allow_writeable_chroot=YES
          pasv_enable=YES
          pasv_address=127.0.0.1
          pasv_min_port=30000
          pasv_max_port=30009
          seccomp_sandbox=NO
          pam_service_name=vsftpd
          EOF
          sudo service vsftpd restart

          sudo install -d -m 775 -o "$NETFS_TEST_USER" -g "$NETFS_TEST_USER" /srv/netfs-smb
          sudo tee -a /etc/samba/smb.conf >/dev/null <<EOF

          [netfs]
            path = /srv/netfs-smb
            browseable = yes
            read only = no
            guest ok = no
            valid users = $NETFS_TEST_USER
          EOF
          printf '%s\n%s\n' "$NETFS_TEST_PASSWORD" "$NETFS_TEST_PASSWORD" |
            sudo smbpasswd -a -s "$NETFS_TEST_USER"
          sudo service smbd restart

          ssh -o BatchMode=yes -i "$NETFS_TEST_IDENTITY_FILE" "$NETFS_TEST_USER@$NETFS_TEST_HOST" true
          curl --fail --silent --show-error --user "$NETFS_TEST_USER:$NETFS_TEST_PASSWORD" "ftp://$NETFS_TEST_HOST/" >/dev/null
          smbclient "//$NETFS_TEST_HOST/$NETFS_TEST_SMB_SHARE" -U "$NETFS_TEST_USER%$NETFS_TEST_PASSWORD" -c ls >/dev/null

      - name: Install netfs
        shell: bash
        run: R CMD INSTALL .

      - name: Run live backend integration tests
        shell: Rscript {0}
        run: |
          library(netfs)
          testthat::test_file("tests/testthat/test-integration.R", reporter = "summary")
